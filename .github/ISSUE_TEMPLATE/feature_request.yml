name: Feature request
description: Something findr should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where findr gets in the way. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, including the key you would expect to press.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: The workaround, or the other tool you reach for.
    validations:
      required: false
