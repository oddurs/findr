version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One pull request a week, not one per action.
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      cargo:
        update-types: [minor, patch]
