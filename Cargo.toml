[package]
name = "findr"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A terminal file browser for developers: Finder's column view with git status, fuzzy filtering, and syntax-highlighted previews"
license = "MIT"
repository = "https://github.com/oddurs/findr"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "git", "finder"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
unicode-width = "0.2"

# syntect's regex engine is slow unoptimised; this keeps debug builds and tests quick.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
insta = "1"
